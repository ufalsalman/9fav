<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Nine - Endfield Edition</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="app-container">
        
        <div id="capture-area" class="capture-container">
            <h1 id="dynamic-title">My Favorite Nine</h1>
            <p id="subtitle">Endfield Edition</p>
            
            <div class="grid-container">
                <div class="box" data-index="0"><span class="placeholder">+ Choose</span></div>
                <div class="box" data-index="1"><span class="placeholder">+ Choose</span></div>
                <div class="box" data-index="2"><span class="placeholder">+ Choose</span></div>
                <div class="box" data-index="3"><span class="placeholder">+ Choose</span></div>
                <div class="box" data-index="4"><span class="placeholder">+ Choose</span></div>
                <div class="box" data-index="5"><span class="placeholder">+ Choose</span></div>
                <div class="box" data-index="6"><span class="placeholder">+ Choose</span></div>
                <div class="box" data-index="7"><span class="placeholder">+ Choose</span></div>
                <div class="box" data-index="8"><span class="placeholder">+ Choose</span></div>
            </div>

            <p id="website-url">9fav.ufal.my.id/endfield</p>
        </div>

        <div class="user-input-section">
            <input type="text" id="user-name" placeholder="Your name (optional)">
        </div>

        <div class="action-buttons">
            <button id="btn-share">Share Link</button>
            <button id="btn-download">Download Image</button>
            <button id="btn-home">Homepage</button>
        </div>

        <div class="footer">
            <p><a href="https://ufal.my.id">ufal.my.id</a></p>
        </div>
    </div>

    <div id="search-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Search for operators</h2>
            <input type="text" id="search-input" placeholder="Operator name">
            <div id="search-results" class="results-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
